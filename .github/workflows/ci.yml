name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  core-tests:
    # The plugin needs the game's assemblies, which cannot be redistributed, so CI builds and tests the engine only.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Test
        run: dotnet test --project tests/ForgeOracle.Core.Tests -c Release
